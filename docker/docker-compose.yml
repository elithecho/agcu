services:
  build-linux:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ../cli:/build
      - ../bin:/output
    command: >
      bash -c "
        set -e
        echo '→ Building Linux x86_64...'
        PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig cargo build --locked --release --target x86_64-unknown-linux-gnu
        cp target/x86_64-unknown-linux-gnu/release/agcu /output/agcu-linux-x64
        chmod +x /output/agcu-linux-x64
        echo '✓ Linux x86_64 done'

        echo '→ Building Linux ARM64...'
        PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig cargo build --locked --release --target aarch64-unknown-linux-gnu
        cp target/aarch64-unknown-linux-gnu/release/agcu /output/agcu-linux-arm64
        chmod +x /output/agcu-linux-arm64
        echo '✓ Linux ARM64 done'
      "

  build-windows:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ../cli:/build
      - ../bin:/output
    command: >
      bash -c "
        set -e
        echo '→ Building Windows x86_64...'
        cargo build --locked --release --target x86_64-pc-windows-gnu
        cp target/x86_64-pc-windows-gnu/release/agcu.exe /output/agcu-windows-x64.exe
        echo '✓ Windows x86_64 done'
      "
